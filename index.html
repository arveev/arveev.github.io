<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arvee</title>
  <meta name="description" content="Hello, I am Arvee" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Manrope", sans-serif;
    }

    :root {
      --ff: "Manrope", sans-serif;
      --h1: 700 1.5rem/1.2em var(--ff);
      --h2: 700 1.25rem/1.4em var(--ff);
      --h3: 700 1.125rem/1.4em var(--ff);
      --h4: 700 1rem/1.4em var(--ff);
      --p: 400 1rem/1.6em var(--ff);
      --small: 400 0.75rem/1.6em var(--ff);

      /* light mode default */
      --bg-dark: oklch(0.92 0 264);
      --bg: oklch(0.96 0 264);
      --bg-light: oklch(1 0 264);
      --text: oklch(0.15 0 264);
      --text-muted: oklch(0.4 0 264);
      --primary: oklch(0.65 0.15 264);
      --secondary: oklch(0.9 0.17 100);
      --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
      --shadow-s: inset 0 1px 2px #ffffff80, 0 1px 2px #00000015, 0 2px 4px #0000000a;
      --shadow-m: inset 0 1px 2px #ffffffa0, 0 2px 4px #00000020, 0 4px 8px #0000000f;
      --transition: all 0.3s ease-in-out;
    }

    body.dark {
      --bg-dark: oklch(0.1 0 264);
      --bg: oklch(0.2 0 264);
      --bg-light: oklch(0.3 0 264);
      --text: oklch(0.96 0 264);
      --text-muted: oklch(0.76 0 264);
      --primary: oklch(0.9 0.17 100);
      --secondary: oklch(0.65 0.15 264);
      --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
      --shadow-s: inset 0 1px 2px #ffffff30, 0 1px 2px #00000030, 0 2px 4px #00000015;
      --shadow-m: inset 0 1px 2px #ffffff50, 0 2px 4px #00000030, 0 4px 8px #00000015;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 1rem auto;
      max-width: min(90vw, 1200px);
      background: var(--bg-dark);
      color: var(--text-muted);
      transition: background 0.3s ease, color 0.3s ease;
    }

    h1 { font: var(--h1); margin-bottom: 0.5rem; color: var(--text); }
    h2 { font: var(--h2); margin-bottom: 0.4rem; color: var(--text); }
    h3 { font: var(--h3); margin-bottom: 0.25rem; color: var(--text); }
    h4 { font: var(--h4); color: var(--text); }
    p  { font: var(--p); color: var(--text-muted); max-width: 80ch; }

    a {
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
    }
    a:hover { color: var(--primary); }

    button, .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem 1.25rem;
      box-shadow: var(--shadow-s);
      cursor: pointer;
      font: var(--p);
      color: var(--text);
      transition: var(--transition);
    }
    button:focus { outline: none; }
    button:hover, .btn:hover, .card:hover {
      background: var(--bg-light);
      box-shadow: var(--shadow-m);
    }

    svg { stroke-width: 2; }

    .wrapper {
      min-height: 95vh;
      display: flex;
      flex-direction: column;
      gap: 10rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-mark {
      width: 0.75rem;
      height: 1rem;
      fill: var(--primary);
      flex-shrink: 0;
    }

    .logo-text {
      font: var(--h3);
      margin: 0;
      color: var(--text);
    }

    .toggle-btn {
      padding: 0;
      width: 1.75rem;
      height: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      box-shadow: none;
    }
    .toggle-btn:hover {
      background: transparent;
      box-shadow: none;
    }
    .toggle-icon {
      stroke: var(--primary);
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(25rem, 100%), 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--bg);
      border-radius: 0.5rem;
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow-s);
      transition: var(--transition);
      display: block;
      color: inherit;
      text-decoration: none;
    }

    footer {
      margin: auto auto 10rem auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      width: min(90vw, 400px);
    }

    footer a { padding: 1rem; }

    footer svg {
      stroke: var(--text);
      stroke-width: 1.5;
      width: 2rem;
      height: 2rem;
      filter: drop-shadow(0 0 0px var(--primary));
      transition: var(--transition);
      fill: none;
    }

    footer a:hover svg {
      stroke: var(--primary);
      scale: 1.1;
      filter: drop-shadow(0 0 8px var(--primary));
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <header>
      <a href="/" class="name-link">
        <svg class="logo-mark" viewBox="0 0 12 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 0 L12 4 L12 12 L6 16 L0 12 L0 4 Z"/>
        </svg>
        <h1 class="logo-text">Arvee</h1>
      </a>
      <button class="toggle-btn" onclick="document.body.classList.toggle('dark')" title="Toggle dark mode">
        <svg class="toggle-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <main>
      <div class="cards">
        <a class="card" href="/about">
          <h3>About Arvee</h3>
          <p>You're probably here for this.</p>
        </a>
        <a class="card" href="/projects">
          <h3>Projects</h3>
          <p>Some stuff I am involved in.</p>
        </a>
        <a class="card" href="/blog">
          <h3>Blog</h3>
          <p>Just because everyone has one.</p>
        </a>
      </div>
    </main>

    <footer>
      <a href="https://github.com/arveev" target="_blank" rel="noopener" title="GitHub">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="https://instagram.com/arvs0z" target="_blank" rel="noopener" title="Instagram">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <a href="https://www.linkedin.com/in/arveevergara" target="_blank" rel="noopener" title="LinkedIn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="2" y="9" width="4" height="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4" cy="4" r="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </footer>

  </div>
</body>
</html>
