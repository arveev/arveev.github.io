<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arvee</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf9;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e5e5;
      --hover-bg: #f0f0ee;
      --accent: #1a1a1a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 80px 24px 60px;
      flex: 1;
    }

    /* Header */
    header {
      margin-bottom: 56px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Cards */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card {
      display: block;
      padding: 20px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .card:hover {
      background: var(--hover-bg);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .card p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Social footer */
    footer {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 24px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--fg);
    }

    footer .dot {
      color: var(--border);
      user-select: none;
    }
  </style>
</head>
<body>

  <main>
    <header>
      <h1>Arvee</h1>
      <p>Building things on the internet.</p>
    </header>

    <div class="cards">
      <a class="card" href="/about">
        <h2>About Me</h2>
        <p>Who I am, what I do, and what I'm working on.</p>
      </a>

      <a class="card" href="/projects">
        <h2>Projects</h2>
        <p>Things I've built — side projects, tools, and experiments.</p>
      </a>

      <a class="card" href="/blog">
        <h2>Blog</h2>
        <p>Occasional writing on tech, design, and whatever's on my mind.</p>
      </a>
    </div>
  </main>

  <footer>
    <a href="https://github.com/arveev" target="_blank" rel="noopener">GitHub</a>
    <span class="dot">·</span>
    <a href="https://instagram.com/arvs0z" target="_blank" rel="noopener">Instagram</a>
    <span class="dot">·</span>
    <a href="https://www.linkedin.com/in/arveevergara" target="_blank" rel="noopener">LinkedIn</a>
  </footer>

</body>
</html>
